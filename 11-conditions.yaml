- name: Conditional operator
  hosts: localhost
  connection: local
  vars:
   NUMBER: 55
  tasks:
  - name: print whether the given number is less than or equal to 100
    ansible.builtin.debug:
     msg: "Given number {{ NUMBER }} is less than or equal to 100"
    when: NUMBER <= 100

  - name: print whether the given number is greater than 100
    ansible.builtin.debug:
     msg: "Given number {{ NUMBER }} is greater than 100"
    when: NUMBER > 100

